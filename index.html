 categorización o sale con una categoría básica, según se decida"},{"owner":"Gobierno de Datos y Category","text":"· Gobierno de Datos corrige en masa categorías y agrupadores, con republicación automática y reversa"},{"owner":"Category y Gobierno de Producto","text":"· Arranque: se carga el árbol vigente sin su deuda, se prueba la ruta de punta a punta y se corta la publicación por lotes"}],"questions":[{"question":"¿En qué momento se asigna la categoría web del producto: al terminar la captura (antes del SKU), después de aprobar el SKU en un módulo fuera del flujo, o se manda una categoría básica y la tienda en línea asigna la final?","owner":"Gobierno de Producto con Comercial","note":"Cambia qué frena la publicación, si Category trabaja dentro o fuera del flujo y quién es dueño de la categoría final; la ficha, el documento de requerimientos y la sesión dicen tres cosas distintas."},{"question":"¿La categoría que elige el seller al iniciar el alta es del árbol web de la tienda o de la clasificación de plantillas?","owner":"Marketplace con Gobierno de Producto","note":"Define si el selector arma la plantilla o la categoría web, y si el mapeo entre plantillas y categorías sigue siendo necesario."},{"question":"¿Quién aprueba una categoría, qué estados tiene y qué pasa si el aprobador la regresa?","owner":"Gobierno de Producto con Category","note":"Sin aprobador no se publica ninguna categoría nueva ni cambiada."},{"question":"Cuando se desliga la única categoría activa de un producto, ¿se bloquea el desligue hasta reasignarlo o el producto se apaga en la tienda?","owner":"Category","note":"Las dos reglas están escritas y producen resultados opuestos para el cliente: producto visible o producto apagado."},{"question":"¿La lista oficial es de 13 o de 14 sitios, y quién la administra?","owner":"Category","note":"Una categoría sin sitio no se publica, y el catálogo que la tienda reconoce depende del sitio."},{"question":"¿Qué se migra, congela o retira de las 5,161 categorías con prefijo antiguo, las 3,113 desligadas y las 27 de nivel 6, y lo retirado se borra o queda como histórico?","owner":"Category con Gobierno de Producto","note":"Decide con qué árbol arranca el nuevo PIM y si se conserva la historia de lo retirado."},{"question":"¿Cuál es la regla oficial del negocio dueño y quién configura las reglas de enrutamiento a sitios, incluida la tabla de marcas para Suburbia?","owner":"Gobierno de Producto con Marketplace","note":"Sin reglas aprobadas el PIM no puede decidir de antemano a qué sitio va cada producto."},{"question":"¿El grupo de artículo se deriva con una tabla de equivalencias o con un modelo, y qué pasa cuando la derivación no es única?","owner":"Gobierno de Producto con SAP/CCoE","note":"Frena el alta de sellers y la creación del SKU, que exige el grupo de artículo."},{"question":"¿Marketplace usa la jerarquía comercial común de SAP o una alterna?","owner":"SAP/CCoE con Comercial","note":"Cambia cómo se clasifican y reportan los productos de Marketplace y tiene impacto en SAP."},{"question":"¿Qué reglas tiene cada bandera de producto, quién la enciende y cuándo, y qué banderas de publicación por canal maneja la tienda en línea?","owner":"Gobierno de Datos con Foro Fotográfico y Comercial","note":"Sin reglas no se puede construir el módulo de banderas; la preventa es la única definida."},{"question":"¿Qué es el agrupador de productos y qué acción toca a cada tipo de diferencia con la tienda?","owner":"Marketplace","note":"La definición está vencida y sin ella no se puede conciliar."},{"question":"¿La carga masiva categoriza con el agente de IA o sin él, y con el mismo mapeo que la captura individual?","owner":"Marketplace con Gobierno de Producto","note":"Hay un acuerdo de categorizar sin IA y un requisito del documento de negocio que pide el agente en la carga masiva de Marketplace."},{"question":"¿Qué pasa si mover, copiar, pegar o eliminar una rama falla a la mitad?","owner":"Category","note":"Un árbol a medias ste y si la marca está vetada; si existe, le dice qué hacer (multioferta, stockout o pedir liberación del EAN) y no se cataloga."},{"owner":"Proveedor o seller","text":"· Captura manual: con la plantilla elegida, el proveedor captura en pasos, primero los obligatorios de su negocio, con el EAN validado al momento; puede guardar como borrador y retomar."},{"owner":"Proveedor y Compras","text":"· Si el producto no tiene familia, se captura en «Otros» y, si no existe en SAP, se pide su alta en SAP."},{"owner":"Proveedor o seller","text":"· Carga masiva por archivo: el proveedor elige la categoría, descarga el layout de su plantilla (vacío o prellenado por código), lo llena y lo sube; recibe un folio y la carga se procesa en segundo plano."},{"owner":"El sistema","text":"· El sistema valida el archivo renglón por renglón con las mismas reglas del alta individual y entrega el reporte de errores, el de caminos para lo que ya existe y el score de cada producto."},{"owner":"Seller","text":"· Plantilla en línea (si se decide construirla): el seller llena una tabla en el portal con avisos por celda; los volúmenes grandes siguen por archivo."},{"owner":"Seller o proveedor con integración","text":"· Catalogación por API: el integrador consulta el árbol y la plantilla, pide sugerencia, busca antes de crear, prevalida, manda productos o lotes, recibe avisos y consulta la etapa de cada producto."},{"owner":"Proveedor","text":"· El proveedor envía la propuesta: recibe folio, estatus y errores por campo y variante; puede dar de baja variantes; en Mercaderías y Suburbia la propuesta pasa a la revisión de Compras."},{"owner":"Proveedor, seller, Compras y Calidad","text":"· Cada usuario sigue sus pendientes en la bandeja de inicio, consulta sus propuestas por folio o SKU y recibe avisos de lo que lleva tiempo sin moverse; Calidad trabaja en colas por etapa."},{"owner":"Compras y proveedor","text":"· Compras actúa sobre la propuesta: aprueba, agrupa looks, cancela o manda a rescate; si rechaza, el proveedor recibe el motivo, corrige y Compras ve qué cambió."},{"owner":"El sistema y proveedor","text":"· Vencimientos y cancelaciones: el rechazo sin corregir se cancela al vencer su plazo y libera su EAN, el proveedor puede cancelar, los borradores abandonados se depuran y todo queda en el historial; SAP recibe el aviso del EAN liberado."},{"owner":"Proveedor y Compras","text":"· Liberación de un EAN en uso: el proveedor la pide, el comprador la autoriza (o se libera sola por regla), el proveedor ve su estado y se resuelve qué pasa con el producto que lo ocupaba."},{"owner":"Proveedor, Compras, Gobierno de Producto y Logística","text":"· Con el SKU creado y la mercancía en camino: el proveedor de Mercaderías ve su fecha límite de enriquecimiento, recibe alertas, catalogación planea Foro y la recepción y las altas nuevas se rigen por si el producto está completo; después, el producto puede cambiar de negocio, sacar una variante de la publicación o relacionarse con otros, y Entrada Única y Foro siguen operando durante la transición."}],"questions":[{"question":"¿Qué pasa con una propuesta rechazada que nadie corrige: se cancela y libera su EAN (diagrama TO-BE) o se elimina (BRD), y a los cuántos días: 30, 60 o 90? ¿Y el borrador de pre-compra, que puede durar meses, tiene su propio plazo?","owner":"Compras","note":"Define lo que ve el proveedor, si el EAN queda libre y si se pierde la propuesta; hoy tres historias dicen cosas distintas."},{"question":"Las altas que nacen en SAP (MM41), en el sistema de marcas propias (PLM) o por B2B, ¿pasan por la revisión de Compras y entran por el PIM, o llegan ya creadas desde SAP?","owner":"Compras con SAP/CCoE","note":"El diagrama TO-BE las manda directo a crear el SKU; si pasan por el PIM, son una quinta puerta de entrada que este módulo no cubre."},{"question":"¿Las importaciones son una puerta de entrada del alta? Hoy son un origen de alta y no aparecen en ningún diagrama TO-BE.","owner":"Compras","note":"Si lo  desde el corte?","owner":"Compras","note":"Define si el primer día se cancelan en automático muchas propuestas y se liberan sus EAN."}],"epics":[{"id":"M3-E1","title":"Ficha del producto: familia, variantes, tipo y relaciones","description":"Define qué es un producto en el PIM: un genérico con sus variantes, su tipo, sus llaves y sus relaciones, igual para Mercaderías, Suburbia y Marketplace.","stories":[{"id":"HU-M3-01-01","moduleId":"M3","epicId":"M3-E1","title":"Ficha de familia del producto con genérico y variantes","status":"lista","como":"Gobierno de Producto","quiero":"guardar y consultar un genérico con todas sus variantes como una sola ficha","para":"que todos los equipos vean el mismo producto completo","pending":[],"tasks":[{"title":"Un genérico no se guarda sin al menos una variante","type":"Regla"},{"title":"Cada variante lleva su SKU y su EAN","type":"Regla"},{"title":"Vista de la familia con sus variantes","type":"Pantalla"}],"definitions":[],"dependencies":["HU-M1-05-02"],"responsible":[],"enhancements":[],"evidence":"FT-PRD-01·H1"},{"id":"HU-M3-01-02","moduleId":"M3","epicId":"M3-E1","title":"Catálogo de tipos de producto por negocio","status":"decision_pendiente","como":"Gobierno de Producto","quiero":"que cada producto tenga un tipo explícito (genérico, variante, genérico de Marketplace, etc.) y un negocio, también los migrados","para":"decidir con él qué atributos, qué flujo y qué integraciones le tocan","pending":["El catálogo de tipos de producto y cómo se deduce de los datos de hoy está propuesto, no aprobado. Hay unos 110 mil registros de P360 sin tipo o sin negocio que irían a revisión; falta que Gobierno de Producto apruebe el catálogo y qué se hace con ellos."],"tasks":[{"title":"Producto sin tipo o sin negocio queda en revisión con incidencia","type":"Regla"},{"title":"Productos con grupo de artículo de Suburbia se marcan como negocio Suburbia","type":"Regla"},{"title":"Mantenimiento del catálogo de tipos de producto: alta, edición y des ","text":"· Con el SKU creado, el seller puede ofertar y ve si su producto se publica o va a revisión; el SKU de Marketplace llega solo a Mirakl."},{"owner":"Gobierno de Producto y Marketplace","text":"· Gobierno de Producto y Marketplace mantienen la blacklist, la lista blanca, la visibilidad de variantes y los umbrales de confianza."}],"questions":[{"question":"¿La blacklist se revisa en cuanto hay marca, aunque no haya coincidencia (acuerdo de taller), o sólo cuando ya hubo coincidencia (diagrama TO-BE)?","owner":"Marketplace","note":"Con el orden del diagrama, un producto nuevo de una marca vetada sin coincidencia llega a catalogarse; con el del taller, se detiene en el primer paso. Hay que confirmar que el diagrama se corrige."},{"question":"¿La blacklist aplica sólo a sellers de Marketplace o también hay marcas prohibidas para cualquiera, incluso para Mercaderías?","owner":"Gobierno de Producto con Marketplace","note":"Si se aplicara a Mercaderías, bloquearía su propio surtido; si existen marcas prohibidas para todos, hace falta otra lista con otra regla."},{"question":"¿Qué pasa si el producto coincide con otro que todavía está en proceso (propuesta sin SKU) de otro proveedor o seller?","owner":"Gobierno de Producto con Marketplace","note":"Las fuentes sólo cubren productos con SKU; sin regla, dos actores pueden catalogar el mismo producto en paralelo o uno queda sin poder ofertar."},{"question":"¿Puede el seller rechazar una coincidencia que considera equivocada y a quién llega su reclamo?","owner":"Marketplace con Gobierno de Datos","note":"Un falso positivo manda al seller a ofertar sobre un producto que no es el suyo o lo bloquea; ninguna fuente da un camino para corregirlo."},{"question":"¿Qué pasa si el mismo seller intenta catalogar de nuevo un producto que ya es suyo en Marketplace?","owner":"Marketplace","note":"La multioferta está pensada para otro seller; para el propio no hay regla y podría duplicar su producto u ofertar contra sí mismo."},{"quest 2"},{"id":"HU-M5-09-13","moduleId":"M5","epicId":"M5-E9","title":"Regla de precedencia de colores de Mercaderías sobre variantes del seller","status":"lista","como":"Marketplace","quiero":"que si Mercaderías prende un color que un seller ya tenía, la variante del seller se apague sola","para":"no vender dos veces la misma variante","pending":[],"tasks":[{"title":"Al prender Mercaderías un color, se apaga la variante del seller con ese color","type":"Regla"},{"title":"El seller ve su variante apagada con el motivo","type":"Aviso"}],"definitions":[],"dependencies":["HU-M4-03-02"],"responsible":[],"enhancements":[],"evidence":"S30-RN-04"},{"id":"HU-M5-09-14","moduleId":"M5","epicId":"M5-E9","title":"Retención de la modificación de un producto publicado hasta su aprobación","status":"lista","como":"Marketplace","quiero":"que una modificación quede retenida hasta que el revisor, avisado, la apruebe, sin detener el SKU","para":"no frenar la venta mientras se revisa el cambio","pending":[],"tasks":[{"title":"El producto sigue publicado con su versión anterior mientras se revisa","type":"Regla"},{"title":"Aviso al equipo revisor con la tarea","type":"Aviso"},{"title":"Aprobada se publica la nueva; rechazada no cambia y el seller ve el motivo","type":"Regla"},{"title":"Asignación de aprobadores: quién aprueba esta solicitud y quién lo suple","type":"Regla"}],"definitions":[],"dependencies":["HU-M5-09-01","HU-M7-09-01","HU-M9-03-08"],"responsible":[],"enhancements":[],"evidence":"FT-PRD-05·H13 · BR-6-21"},{"id":"HU-M5-09-15","moduleId":"M5","epicId":"M5-E9","title":"Inactivación temporal de un producto publicado mientras se corrige","status":"lista","como":"Gobierno de Datos","quiero":"inactivar un producto publicado mientras se corrige un dato","para":"que no se venda con información equivocada en ningún canal","pending":[],"tasks":[{"title":"Deja de estar visible y a la venta en todos los canales donde estaba","type":"Integración"},{"title":"Al reactivarse vuelve a los mismos canales sin crear SKU nuevo","type":"Regla"}],"definitions":[],"dependencies":["HU-M7-09-01"],"responsible":[],"enhancements":[],"evidence":"FT-PRD-05·H14 · BR-6-21"}]}],"counts":{"epics":9,"stories":77,"states":{"decision_pendiente":11,"por_definir":33,"lista":33}}},{"id":"M6","name":"Imágenes y Foro","process":[{"owner":"Gobierno de Producto","text":"· Gobierno de Producto define los tipos de imagen, video y documento con su ficha técnica, cuántas pide cada plantilla y negocio, sus excepciones y el orden de la galería"},{"owner":"proveedor","text":"· En la captura (portal o archivo masivo) el proveedor marca quién pone la foto: Foro, él mismo o un modelo de IA"},{"owner":"proveedor o seller","text":"· Si la foto es del proveedor o del seller, la carga por su canal (portal, liga, carga masiva o Catalogación por API); el PIM la valida, la corrige y registra la liga por variante"},{"owner":"proveedor o seller","text":"· Las imágenes de un color se heredan a sus tallas; el seller puede crear variantes desde sus fotos y ve si un SKU depende de una agrupación"},{"owner":"el sistema","text":"· Con el SKU creado, el PIM decide tomar o no tomar, el tipo de toma y avisa a Foro sólo lo que le toca, también lo que nace en SAP"},{"owner":"Foro Fotográfico","text":"· Camino de foto con IA: el sistema toma los datos del producto, fija guía y modelo, genera, califica y regenera; lo que no pasa va a revisión escalonada o se usa la foto original; lo aprobado se carga solo"},{"owner":"Logística de Foro","text":"· Camino de estudio: Logística recibe las muestras, consulta el lote, escanea, ubica y da salida a cada muestra"},{"owner":"fotógrafo de Foro","text":"· El fotógrafo toma las fotos con la guía; la IA pone fondo blanco y las fotos pasan solas al PIM con su bitácora"},{"owner":"coordinador y editor del estudio","text":"· El coordinador asigna editores; el editor valida, reemplaza, compara y agrega video"},{"owner":"Foro Fotográfico","text":"· Mientras el producto está en Foro, Foro consulta el producto y sus imágenes, sabe si cambió, y el PIM protege la edición y muestra el estatus a cada quien"},{"owner":"Foro Fotográfico","text":"· Al cerrar la edición, el PIM recibe las imágenes, el video y el enriquecimiento de Foro y el producto pasa a revisión de QA"},{"owner":"Foro Fotográfico, Gobierno de Datos y Compras","text":"· Si Foro no puede trabajar el producto, lo regresa a Gobierno de Datos con motivo o al comprador por plantilla equivocada; se detectan inconsistencias foto–datos y, si cambia la plantilla, se reinicia la captura"},{"owner":"Foro Fotográfico y Gobierno de Datos","text":"· Los productos detenidos se rescatan con o sin foto y se enrutan por EAN, foto y existencia en tienda; si el proveedor no termina, catalogación interna lo retoma"},{"owner":"QA y el sistema","text":"· QA revisa las imágenes por variante y por imagen; al tener SKU se fija la copia y sólo la liga fija sale a los canales"},{"owner":"catalogador, seller y Marketplace","text":"· Después de publicar: cambios de imágenes, etiqueta y candado de fotos con IA, aclaración del seller con el KAM e historial de la foto con IA"}],"questions":[{"question":"¿En qué momento del flujo se avisa a Foro, es obligatorio, qué se asigna y a qué tablas (reglas de Foro 40), y cómo afectan esas reglas a la creación de variantes y a lo que nace en SAP?","owner":"Foro Fotográfico con Mercaderías","note":"Sin esto Foro no sabe qué fotografiar ni cuándo; el compromiso de compartir las reglas venció el 6-nov."},{"question":"¿Qué significa la opción «modelo de IA» al marcar quién pone la foto, para qué negocios aplica la foto con IA (Mercaderías, Marketplace o ambos) y la generación corre antes o después del SKU?","owner":"Foro Fotográfico, Mercaderías y Marketplace","note":"Las fuentes chocan: el documento de negocio la pide para Mercaderías, las historias son de Marketplace y Foro dijo que no trabaja modelos de IA; define todo el camino de foto con IA."},{"question":"Mientras el producto está en Foro, ¿se bloquea su edición o conviven dos estados (catalogación y Foro)? ¿Qué captura prevalece si el mismo atributo se llena en el portal y en Foro?","owner":"Gobierno de Producto con Foro Fotográfico","note":"Decide si un área puede detener a otra y si se pierden datos buenos."},{"question":"¿La existencia en tienda decide la ruta del rescate a propósito? ¿Qué plazo tiene el proveedor cuando hay foto y no EAN? ¿Cuándo aplica la foto directa en tienda y quién la toma? ¿Qué estatus ve el proveedor en el traspaso a catalogación interna?","owner":"Gobierno de Producto, Foro Fotográfico y Compras","note":"El rescate es el único camino para productos detenidos que ya se venden; por ahora sólo hay propuesta."},{"question":"¿Se conserva una copia fija de cada imagen al obtener el SKU, y las imágenes del seller se copian al PIM o se sirven desde su servidor?","owner":"Gobierno de Producto con TI","note":"Define qué imagen ve el cliente, la compuerta de publicación y cómo se cambian las imágenes después."},{"question":"¿Qué reglas aplican para cambiar imágenes de un producto ya publicado?","owner":"E-commerce con Foro Fotográfico","note":"La especificación remite a un documento que no existe; sin reglas cada cambio se resuelve por correo."},{"question":"Con la toma por modelos de IA, ¿qué parte del estudio sigue viva: cámara conectada, transferencia automática, editores y asignación?","owner":"Foro Fotográfico","note":"Puede sobrar construir pantallas del estudio o faltar las que sí se usan."},{"question":"¿Qué pantallas de Foro pasan al portal único y cuáles quedan propias del área (en particular la logística)? ¿Hay acta de la decisión?","owner":"Foro Fotográfico, Gobierno de Producto y TI","note":"La unificación se acordó en una llamada sin acta y Foro pide conservar la logística aparte."},{"question":"¿Cuál es la lista final de tipos de activo y el máximo de imágenes de detalle (15, 19 o 20)?","owner":"Gobierno de Producto con Foro Fotográfico","note":"Sin . Lo definen E-commerce y Foro."],"tasks":[{"title":"Se republica sin revalidar completitud","type":"Regla"},{"title":"Cambios a fotos con IA siguen el proceso de modificación","type":"Regla"}],"definitions":[{"topic":"Reglas para cambios de imágenes","owner":"Comercial (E-commerce) con Foro Fotográfico"}],"dependencies":["HU-M5-09-06","HU-M7-08-01"],"responsible":["Comercial (E-commerce) con Foro Fotográfico"],"enhancements":[],"evidence":"FT-ACT-02·H5 · BR-4-21 · BRD-19"},{"id":"HU-M6-10-06","moduleId":"M6","epicId":"M6-E10","title":"Compuerta de publicación por imagen principal fija (común a los canales de venta)","status":"decision_pendiente","como":"Gobierno de Producto","quiero":"que a los canales sólo viaje la liga fija de cada imagen y que un producto sin principal fija no se publique y deje el motivo","para":"que la tienda muestre siempre la imagen aprobada","pending":["Depende de la misma decisión que la copia fija: si no se conserva, la compuerta revisa la imagen de trabajo y no la fija. Lo decide TI con Gobierno de Producto."],"tasks":[{"title":"Sólo la liga fija viaja a la tienda en línea y a los demás canales","type":"Regla"},{"title":"Sin principal fija el producto no sale y queda el motivo «Sin imágenes congeladas»","type":"Regla"},{"title":"Motivo de no publicación visible en la consulta del producto","type":"Aviso"}],"definitions":[],"dependencies":["HU-M6-10-02","HU-M7-05-01","HU-M5-08-04","HU-M9-09-06"],"responsible":[],"enhancements":[],"evidence":"FT-ACT-02·H3 · BR-4-20"}]},{"id":"M6-E11","title":"Foro dentro del portal único","description":"Junta las pantallas de Foro y de Entrada Única en un solo portal sobre el PIM, y decide cuáles pasan y cuáles se quedan como propias de Foro.","stories":[{"id":"HU-M6-11-01","moduleId":"M6","epicId":"M6-E11","title":"Inventario de pantallas de Foro que pasan al portal único","status":"decision_pendiente","como":"Foro Fotográfico","quiero":"saber qué pantallas de Foro pasan al portal único con Entrada Única y cuáles quedan propias del área","para":"operar en un solo portal sin perder ninguna pantalla que el área necesita","pending":["La unificación se acordó en una llamada sin acta; falta el acta con fecha y la lista de pantallas. Foro pide conservar la logística como pantalla propia. Lo deciden Foro, Gobierno de Producto y TI."],"tasks":[{"title":"Perfiles de Foro con acceso a sus pantallas en el portal único","type":"Regla"}],"definitions":[{"topic":"Acta de la decisión de portal único","owner":"Foro Fotográfico"},{"topic":"Lista de pantallas de Foro que pasan y que quedan","owner":"Foro Fotográfico"}],"dependencies":["HU-M9-05-08","HU-M9-01-01","HU-M10-06-05","HU-M10-04-07"],"responsible":["Foro Fotográfico"],"enhancements":["Inclusión módulo Foro en EU"],"evidence":"BR-4-32"}]}],"counts":{"epics":11,"stories":74,"states":{"decision_pendiente":16,"lista":28,"por_definir":30}}},{"id":"M7","name":"Integraciones con SAP y canales","process":[{"owner":"el sistema","text":"· SAP envía cada noche y cada madrugada sus catálogos (listas de valores, proveedores, jerarquía comercial, precio y costo) y el PIM los aplica, o el PIM escribe en SAP los valores de los catálogos que gobierne."},{"owner":"Compras","text":"· Compras aprueba la propuesta y sale una sola solicitud de SKU, con la misma lógica para cualquier canal de entrada."},{"owner":"el sistema","text":"· Antes de enviar, el PIM valida lo que SAP exige y arma la descripción automática de la plantilla."},{"owner":"el sistema","text":"· El PIM envía a SAP los archivos de alta (o la familia completa cuando se agrega una variante); un artículo con error no detiene el lote."},{"owner":"SAP","text":"· SAP responde con SKU, EAN y nombre corto; el PIM los muestra en la propuesta y avisa a Entrada Única y a Foro."},{"owner":"Gobierno de Datos","text":"· Si SAP rechaza, el error se ve en la propuesta, se rutea al área que corrige y Gobierno de Datos lo resuelve desde su bandeja; el tablero muestra los errores que más se repiten."},{"owner":"Gobierno de Datos","text":"· Los SKU creados directo en SAP entran solos al PIM, salvo las exclusiones; se identifican, se clasifican y se concilian los que falten."},{"owner":"Publicación","text":"· El producto aprobado que cumple el mínimo del canal se publica en la tienda en línea, con sus candados de imagen, categoría y visibilidad."},{"owner":"el sistema","text":"· OMS recibe el producto y confirma; sólo con su acuse se vende en la tienda. El DWH y Señalización reciben su envío diario, según la matriz de eventos y destinos."},{"owner":"Publicación","text":"· Cada envío queda «Enviado» o «Publicado» por destino; los errores técnicos se reintentan solos y lo pendiente se republica."},{"owner":"el sistema","text":"· Cada cambio de estatus, de precio o de costo se avisa a Entrada Única y a Foro mientras sigan leyendo esos avisos."},{"owner":"Compras","text":"· Una modificación posterior viaja sólo a los sistemas afectados, y a SAP si toca su dato maestro; el KAM cambia el tipo de material de sus sellers."},{"owner":"Gobierno de Producto","text":"· Lo scrapeado se muestra en la página del producto y se puede apagar al momento."},{"owner":"Repoblamiento","text":"· Repoblamiento reenvía en masa productos publicados, con vista previa, resultado por producto, rastro y reversa, sin cambiar su estado."},{"owner":"Compras","text":"· Compras consulta en el PIM el inventario disponible que reportan otros sistemas."}],"questions":[{"question":"¿Quién es dueño de tallas, colores, marca, modelo del proveedor y descripción: SAP, el PIM o depende del catálogo? ¿Quién puede administrarlos?","owner":"Gobierno de Producto con SAP/CCoE","note":"Define si el PIM sólo recibe listas de SAP o las escribe en SAP; cambia tres historias y las descripciones automáticas."},{"question":"¿Cuál es el formato y el medio de los archivos con SAP sin intermediario (alta, respuesta, errores, precio y costo), y se adopta la respuesta inmediata de SAP?","owner":"SAP/CCoE","note":"Sin formato no se puede construir ni probar la creación del SKU."},{"question":"¿A qué estado regresa una propuesta que SAP rechaza, y cuál es el listado de errores de SAP por área que los corrige? ¿Qué pasa con un error que no está en el listado?","owner":"Gobierno de Datos con Gobierno de Producto","note":"Sin esto el error no llega a nadie y el producto se queda detenido."},{"question":"¿Qué reglas de la MM41 valida el PIM antes de enviar y cuáles se quedan en SAP?","owner":"Gobierno de Producto con SAP/CCoE","note":"Decide si SAP sigue siendo el último validador o si el error se detecta en la captura."},{"question":"¿Siguen las altas directas en SAP (MM41, PLM, B2B)? ¿Pasan por Compras? ¿El filtro de exclusión vive en SAP o en el PIM?","owner":"Gobierno de Datos con Compras y SAP/CCoE","note":"Son 7 a 9 mil SKU por semana que entran sin pasar por la catalogación."},{"question":"¿Qué cambio va a qué sistema, en qué momento y para qué negocio? ¿Qué cambios posteriores a la publicación van a SAP?","owner":"Publicación con Marketplace y los dueños de cada sistema","note":"Sin la matriz se manda de más o de menos a OMS, DWH, Señalización, Entrada Única y SAP."},{"question":"¿OMS puede confirmar que recibió un producto? ¿Quién es su dueño, por qué medio recibe y qué reglas aplican a garantías y servicios?","owner":"OMS con TI","note":"Sin acuse de OMS no se puede aplicar la regla de no vender lo que no se puede entregar."},{"question":"¿Qué formato, campos y agenda aceptan el DWH (foto y diccionario) y Señalización?","owner":"DWH y Señalización con TI","note":"No hay muestra de los envíos de hoy; al apagar el sistema actual nadie los generaría."},{"question":"¿La categoría es obligatoria para aprobar o sólo para publicar en la tienda? ¿Sale un producto sin imagen principal congelada? ¿El score de Marketplace frena la publicación?","owner":"Gobierno de Producto con Category y Marketplace","note":"Son los candados que deciden si un producto aprobado llega o no a la tienda."},{"question":"¿Cuántos reintentos, cada cuánto y quién atiende lo agotado, tanto con SAP como con los canales?","owner":"Gobierno de Datos con TI y SAP/CCoE","note":"Hoy SAP reintenta sin límite y los canales no reintentan; sin política, lo agotado se pierde."},{"question":"¿El repoblamiento llega a OMS? ¿Qué viaja después del archivo, cuál es el alcance de la reversa, el volumen por corrida y su ventana? ¿Se sigue usando el envío del producto en repoblamiento a Compras o al proveedor?","owner":"Repoblamiento con Category","note":"Una corrida mal acotada ya bajó los visibles de un seller y tardó tres días en revertirse."},{"question":"¿Qué avisos de hoy a Entrada Única y Foro siguen teniendo consumidor? ¿STEP sigue vivo después del corte? ¿Cuál es la fuente de verdad del Conjunto Look? ¿Se corrige el aviso de S4H?","owner":"TI con Entrada Única y Foro","note":"Al apagar P360 ningún consumidor vivo debe quedarse sin aviso, y los que nadie lee se retiran."},{"question":"¿Cómo y cada cuánto llegan la jerarquía comercial y el precio y costo de Suburbia (S4H)? ¿SAP puede mandar sólo cambios?","owner":"SAP/CCoE con Gobierno de Producto","note":"Hoy no hay lector de S4H para jerarquía, precio ni costo."},{"question":"¿Entra la consulta de inventario en el PIM y de qué fuente? ¿Qué necesita el KAM para cambiar el tipo de material y quién puede hacerlo?","owner":"Compras y Marketplace","note":"Sólo las pide una nota del documento de negocio; sin respuesta no se pueden construir."},{"question":"¿Quién mantiene la matriz de eventos, destinos y contenido por sistema después del arranque, y quién aprueba sus cambios?","owner":"Gobierno de Producto con las áreas dueñas de OMS, DWH y Señalización","note":"Si nadie la mantiene, un sistema nuevo o un campo nuevo no llega a OMS, al DWH ni a Señalización hasta que alguien lo pida a mano."},{"question":"Si un archivo nocturno de SAP (listas, proveedores, jerarquía, precio y costo) no llega o llega incompleto, ¿quién lo atiende y qué se de or módulo, acción, negocio, sección, grupo de atributos y campo, y sólo sus productos."},{"owner":"Marketplace","text":"· El integrador que cataloga por API pide y recibe sus credenciales, con permiso, límite de llamadas, nivel de servicio y monitoreo de su consumo."},{"owner":"TI","text":"· Cada sistema interno (Entrada Única, Foro, SAP, IA) entra con su propia credencial y cada servicio verifica quién llama; se cierran las entradas abiertas y se prueba la seguridad antes de producción."},{"owner":"el sistema","text":"· Toda alta, cambio o consulta de producto, de cualquier canal, pasa por el mismo núcleo con las mismas reglas, y cada cambio se avisa una vez a quien lo usa."},{"owner":"usuario interno","text":"· El usuario consulta y busca productos por identificador, SKU, EAN, marca y modelo, o en solo lectura."},{"owner":"el sistema","text":"· Cada cambio queda en la bitácora inmutable, con versiones restaurables, comparación, origen de cada valor, trazabilidad de rechazos y reversa de ejecuciones masivas; los archivos se conservan el plazo acordado."},{"owner":"Gobierno de Producto","text":"· Gobierno de Producto mide tiempos por paso, la revisión de Compras, la publicación, los recálculos y dónde nacen los errores, con línea base antes del cambio de plantillas."},{"owner":"Gobierno de Producto","text":"· El negocio consulta tableros fijos y arma los suyos."},{"owner":"Gobierno de Producto","text":"· El negocio saca reportes, exportes e importes de productos y categorías, busca por atributos o listas masivas, y KAM y Marketplace siguen a sus sellers, sin afectar la operación."},{"owner":"Marketplace","text":"· Marketplace recibe alertas de caída de visibles, baja al producto para ver la causa y mide la recuperación."},{"owner":"Operación","text":"· Operación y TI vigilan procesos de fondo, envíos pendientes y errores por integración, y reintentan lo pendiente."}],"questions":[{"question":"¿Cuál es la matriz de roles firmada (perfil, módulo, acción, negocio, grupo de atributos o campo, estado)? ¿Se aprueba la propuesta de 24 perfiles? ¿Qué acciones piden segundo factor?","owner":"Gobierno de Producto con Seguridad","note":"Sin matriz no se puede construir ningún permiso, la migración de usuarios ni el segundo factor; bloquea casi toda la épica de roles."},{"question":"¿El directorio de usuarios es propio del PIM o compartido con otro sistema de Liverpool? ¿Qué plan del proveedor de identidad se contrata y cómo se dan credenciales a sistemas e integradores?","owner":"TI con Seguridad","note":"Define cómo entran personas, sistemas e integradores y cuánto cuesta."},{"question":"¿Las cuentas de Foro se unen al directorio del PIM o se quedan en Foro?","owner":"TI con Seguridad y Foro Fotográfico","note":"Las fuentes se contradicen y de eso depende la migración de cuentas al corte."},{"question":"¿Cómo se identifica el negocio de cada alta de un proveedor que es de Mercaderías y de Marketplace a la vez?","owner":"Gobierno de Producto con Marketplace","note":"Sin esto no se aíslan bien los productos ni se aplican las reglas del negocio correcto."},{"question":"¿Quién es dueño del gobierno de la catalogación por API? ¿Cómo se solicitan, aprueban y dan de baja las credenciales, con qué vigencia de sesión, qué límite de llamadas y qué nivel de servicio?","owner":"Marketplace con TI y Seguridad","note":"La catalogación por API está diseñada, pero nadie puede dar de alta a un integrador sin estas reglas."},{"question":"¿Cuánto tiempo se conservan la bitácora, los registros del sistema y los archivos de integración? ¿Cada cuánto nace una versión al editar y la versión 1 es la migración?","owner":"Gobierno de Datos con Jurídico y TI","note":"Una bitácora «inmutable» sin plazo crece sin límite; sin plazo de archivos no se pueden investigar incidencias pasadas."},{"question":"¿Los módulos nuevos entran al portal por una sola puerta o se conectan sueltos? ¿Dónde está el acta del portal único y qué vistas y estatus ve cada perfil?","owner":"Gobierno de Producto y Entrada Única con TI","note":"Define cómo se construye todo el portal y cómo se aplican los permisos de pantalla."},{"question":"¿Cuál es el origen principal de las altas y siguen las altas por SAP?","owner":"Compras con Gobierno de Producto","note":"El núcleo único tiene que saber qué canales atiende."},{"question":"¿Qué exportes, columnas, búsquedas y metas de tiempo necesita el negocio? ¿La consulta por atributos vive en el PIM o en el DWH? ¿Qué reglas lleva el reporte de categorías por niveles?","owner":"Gobierno de Producto con Category y Comercial","note":"Sin catálogo de reportes se construye a ciegas y se repite lo de hoy."},{"question":"¿Qué ve el KAM y con qué jerarquía comercial de Marketplace? ¿Qué lleva la vista del CUA?","owner":"Marketplace","note":"Marketplace no puede dar seguimiento a sus sellers sin estas vistas."},{"question":"¿Cuál es el umbral final de caída de visibles, por qué canal llega la alerta, contra qué se compara y de dónde se lee la visibilidad real?","owner":"Marketplace con TI","note":"Sin canal ni umbral, la alerta no llega antes que el negocio."},{"question":"¿Cuáles son los pasos del flujo nuevo a medir y el catálogo de puntos de detección de errores? ¿Los indicadores de Compras son por comprador, por sección o ambos, y qué es «aprobada sin revisión»?","owner":"Gobierno de Producto con Compras","note":"Sin pasos ni catálogo, las métricas no se pueden comparar con la línea base."},{"question":"¿Contra qué base de atributos se reporta la completitud con plantillas delgadas?","owner":"Gobierno de Producto","note":"Al medir contra todos los atributos la completitud baja y puede leerse como un retroceso."},{"question":"¿Qué se monitorea de la plataforma, con qué umbrales y quién atiende las alertas? ¿Quién ejecuta la prueba de penetración y cuándo?","owner":"TI","note":"Sin dueño, las fallas llegan primero al negocio."},{"question":"Si el directorio de usuarios no responde, ¿se detiene todo el PIM (portal, Entrada Única, Foro y catalogación por API) o hay una forma de seguir operando?","owner":"Operación del PIM con Gobierno de Producto","note":"Todos los módulos dependen de saber quién entra; sin regla, una caída del directorio para la catalogación completa."},{"question":"Al revertir una ejecución masiva, ¿qué pasa con los productos que alguien cambió después de esa ejecución: se respeta el cambio posterior o se sobrescribe?","owner":"Gobierno de Producto","note":"Una reversa sin regla puede borrar correcciones buenas hechas a mano."},{"question":"¿Restaurar una versión del producto y cambiar la matriz de roles requieren aprobación de otra persona? ¿Quién aprueba la matriz?","owner":"Gobierno de Producto con Auditoría","note":"Son las dos acciones que pueden deshacer controles de todo el PIM; hoy ninguna fuente dice quién las autoriza."}],"epics":[{"id":"M9-E1","title":"Acceso de usuarios: identidad única y sesión segura","description":"Que usuarios internos, proveedores y sellers entren al PIM con una sola cuenta, con doble factor y con su negocio identificado.","stories":[{"id":"HU-M9-01-01","moduleId":"M9","epicId":"M9-E1","title":"Directorio único de usuarios del PIM con alta, baja y recuperación de acceso","status":"decision_pendiente","como":"usuario interno","quiero":"entrar al PIM con una sola identidad, y que el alta, la baja, la revocación inmediata y la recuperación de contraseña se hagan en un solo directorio","para":"no administrar altas y bajas en varios directorios","pending":["Falta ratificar con Seguridad si el directorio es propio del PIM o compartido con otro sistema de Liverpool, y medir el plan contratado del proveedor de identidad. Lo deciden TI y Seguridad."],"tasks":[{"title":"Alta, baja y revocación inmediata de acceso","type":"Pantalla"},{"title":"Recuperación de contraseña","type":"Pantalla"},{"title":"Conexión con el directorio de usuarios que se elija","type":"Integración"},{"title":"Desbloqueo de cuenta por el propio usuario o por el administrador","type":"Pantalla"}],"definitions":[],"dependencies":[],"responsible":[],"enhancements":[],"evidence":"FT-USR-01·H1 · BR-78-06 · BR-78-11"},{"id":"HU-M9-01-02","moduleId":"M9","epicId":"M9-E1","title":"Inicio de sesión con doble factor y cierre de sesión seguro del portal","status":"por_definir","como":"usuario interno","quiero":"entrar con usuario, contraseña y doble factor, cerrar sesión de forma segura y confirmar con segundo factor las acciones sensibles","para":"proteger el catálogo de accesos indebidos","pending":["Falta la lista de acciones sensibles que piden segundo factor; depende de la matriz de roles. La define Gobierno de Producto con Seguridad."],"tasks":[{"title":"Inicio de sesión con doble factor","type":"Pantalla"},{"title":"Vigencia y cierre de sesión del portal","type":"Regla"}],"definitions":[{"topic":"Lista de acciones sensibles con segundo factor","owner":"Gobierno de Producto"}],"dependencies":["HU-M9-01-01","HU-M9-03-01","HU-M9-09-08"],"responsible":["Gobierno de Producto"],"enhancements":[],"evidence":"BR-78-07"},{"id":"HU-M9-01-03","moduleId":"M9","epicId":"M9-E1","title":"Cuentas propias de proveedor y seller con su negocio","status":"por_definir","como":"proveedor","quiero":"entrar con mi propia cuenta y que el PIM identifique mi tipo y mi negocio","para":"operar sólo mis productos","pending":["Falta definir cómo se identifica el negocio de cada alta de un proveedor que es de Mercaderías y de Marketplace a la vez. Lo define Gobierno de Producto con Marketplace."],"tasks":[{"title":"Tipo y negocio del proveedor en su cuenta","type":"Regla"},{"title":"El seller que integra por sistema entra con credencial propia","type":"Regla"}],"definitions":[{"topic":"Negocio del proveedor híbrido","owner":"Gobierno de Producto con Marketplace"}],"dependencies":["HU-M9-01-01"],"responsible":["Gobierno de Producto con Marketplace"],"enhancements":[],"evidence":"FT-USR-01·H4"},{"id":"HU-M9-01-04","moduleId":"M9","epicId":"M9-E1","title":"Administración de usuarios subordinados del proveedor","status":"por_definir","como":"proveedor","quiero":"que un proveedor administrador cree usuarios restringidos de su empresa","para":"repartir el trabajo sin compartir cuentas","pending":["Ninguna historia lo cubre; falta decidir qué puede hacer el usuario restringido."],"tasks":[{"title":"Alta y baja de usuarios subordinados por el proveedor","type":"Pantalla"}],"definitions":[{"topic":"Permisos del proveedor restringido","owner":"Gobierno de Producto"}],"dependencies":["HU-M9-01-03","HU-M9-03-01"],"responsible":["Gobierno de Producto"],"enhancements":[],"evidence":"BR-78-12"},{"id":"HU-M9-01-05","moduleId":"M9","epicId":"M9-E1","title":"Administración de usuarios, roles y perfiles en el PIM con historial de accesos","status":"por_definir","como":"administrador","quiero":"dar de alta usuarios, asignar perfiles (proveedor, Compras, PLM, Foro Fotográfico, Gobierno de Datos) y ver el historial de accesos","para":"administrar el acceso de todas las áreas dentro del PIM","pending":["Falta decidir qué usuarios de P360 se migran y con qué perfil; depende de la matriz de roles."],"tasks":[{"title":"Administración de usuarios y perfiles","type":"Pantalla"},{"title":"Historial de accesos","type":"Reporte"},{"title":"Migración del padrón de usuarios de P360 con su perfil","type":"Carga de datos"},{"title":"Asignación masiva de perfiles a usuarios por archivo","type":"Carga de datos"}],"definitions":[{"topic":"Usuarios y perfiles que se migran","owner":"Gobierno de Datos"}],"dependencies":["HU-M9-01-01","HU-M9-03-01","HU-M9-06-01","HU-M10-04-07"],"responsible":["Gobierno de Datos"],"enhancements":[],"evidence":"FT-USR-01·H6 · BR-78-47"},{"id":"HU-M9-01-06","moduleId":"M9","epicId":"M9-E1","title":"Cuenta única para el portal, Entrada Única y Foro en el directorio del PIM","status":"decision_pendiente","como":"usuario interno","quiero":"usar la misma cuenta para el portal del PIM, Entrada Única y Foro","para":"no tener una cuenta distinta por sistema","pending":["Choque: la ficha de identidad dice que los usuarios de Foro se quedan en Foro; la decisión posterior de un solo sistema y un solo portal pide un solo directorio para Entrada Única y Foro. La migración de las cuentas está en el módulo de migración (M10). Lo deciden TI y Seguridad con Foro Fotográfico."],"tasks":[{"title":"Una sola cuenta para portal, Entrada Única y Foro","type":"Regla"}],"definitions":[{"topic":"Si las cuentas de Foro se unen al directorio del PIM","owner":"Foro Fotográfico con Gobierno de Producto"}],"dependencies":["HU-M9-01-01","HU-M10-04-07"],"responsible":["Foro Fotográfico con Gobierno de Producto"],"enhancements":[],"evidence":"BR-78-13"},{"id":"HU-M9-01-07","moduleId":"M9","epicId":"M9-E1","title":"Alta y activación de proveedores y sellers nuevos en el portal","status":"por_definir","como":"área que habilita proveedores y sellers","quiero":"dar de alta la cuenta de un proveedor o seller nuevo a partir de su registro de origen y activarla","para":"que pueda catalogar desde el primer día con su negocio correcto","pending":["Recomendada por el análisis: ninguna fuente la pide. Los funcionales deciden si se necesita."],"tasks":[{"title":"Alta de la cuenta desde el padrón de origen","type":"Pantalla"},{"title":"Aviso de bienvenida al activar la cuenta","type":"Aviso"},{"title":"Asignación del negocio y del responsable de la cuenta","type":"Pantalla"}],"definitions":[],"dependencies":["HU-M9-01-01","HU-M9-01-03","HU-M7-01-04","HU-M9-09-10","HU-M9-03-08"],"responsible":[],"enhancements":[],"evidence":"REC-05"},{"id":"HU-M9-01-08","moduleId":"M9","epicId":"M9-E1","title":"Inactivación automática de cuentas sin uso y su reactivación con aprobación","status":"por_definir","como":"administrador de usuarios","quiero":"que las cuentas sin uso se inactiven solas después del plazo que defina el negocio y que reactivarlas pida aprobación","para":"que nadie conserve accesos que ya no le corresponden","pending":["Recomendada por el análisis: ninguna fuente la pide. Los funcionales deciden si se necesita."],"tasks":[{"title":"Inactivación automática por tiempo sin uso","type":"Regla"},{"title":"Reactivación de la cuenta con aprobación","type":"Pantalla"},{"title":"Aviso previo al usuario antes de inactivar su cuenta","type":"Aviso"}],"definitions":[],"dependencies":["HU-M9-01-01","HU-M9-03-08","HU-M9-09-08","HU-M9-09-09"],"responsible":[],"enhancements":[],"evidence":"REC-06"},{"id":"HU-M9-01-10","moduleId":"M9","epicId":"M9-E1","title":"Revisión periódica de accesos por área","status":"por_definir","como":"responsable de cada área","quiero":"revisar cada cierto tiempo quién de mi área tiene qué permisos y confirmarlos o quitarlos","para":"mantener los permisos al día","pending":["Recomendada por el análisis: ninguna fuente la pide. Los funcionales deciden si se necesita."],"tasks":[{"title":"Campaña de revisión de accesos","type":"Pantalla"},{"title":"Confirmación o retiro de permisos","type":"Pantalla"},{"title":"Reporte de la revisión","type":"Reporte"}],"definitions":[],"dependencies":["HU-M9-03-01","HU-M9-01-12","HU-M9-09-09"],"responsible":[],"enhancements":[],"evidence":"REC-08"},{"id":"HU-M9-01-11","moduleId":"M9","epicId":"M9-E1","title":"Suplencia y delegación temporal de permisos","status":"por_definir","como":"usuario que se ausenta","quiero":"delegar mis tareas y permisos a otra persona por un periodo","para":"que el flujo no se detenga en vacaciones o ausencias","pending":["Recomendada por el análisis: ninguna fuente la pide. Los funcionales deciden si se necesita."],"tasks":[{"title":"Delegación con fecha de inicio y fin","type":"Pantalla"},{"title":"Regreso automático de los permisos","type":"Regla"}],"definitions":[],"dependencies":["HU-M9-03-01","HU-M9-03-06","HU-M9-03-08","HU-M9-06-01"],"responsible":[],"enhancements":[],"evidence":"REC-09"},{"id":"HU-M9-01-12","moduleId":"M9","epicId":"M9-E1","title":"Reporte de quién tiene acceso a qué","status":"por_definir","como":"au onvivencia","process":[{"owner":"Gobierno de Datos","text":"· Perfilar los datos de P360: completitud por atributo y por plantilla, empezando por lo que tiene oferta activa."},{"owner":"Gobierno de Producto con Gobierno de Datos","text":"· Firmar las reglas de pasa o no pasa por ola, la matriz de atributos con dueño, etapa y fuente, y el destino de lo que no pasa."},{"owner":"Gobierno de Producto con TI","text":"· Respaldar plantillas, atributos, fórmulas y datos de SKU antes de cualquier cambio de estructura."},{"owner":"Equipo de migración, QA y Gobierno de Producto","text":"· Migrar plantillas, atributos y listas con la obligatoriedad vigente de cada negocio, convertir sus relaciones en reglas y conciliar la carga con firma."},{"owner":"Gobierno de Producto","text":"· Pasar al modelo de plantillas delgadas: reclasificar nodos y plantillas, mover los SKU vivos y volver a ligar fórmulas y relaciones."},{"owner":"Equipo de migración","text":"· Probar la migración de productos con un piloto de 10,000 familias."},{"owner":"Equipo de migración y QA","text":"· Migrar los productos con su identificador, su versión inicial y la historia que se decida, y conciliarlos contra P360 y contra la tienda en línea sin crear bloqueos nuevos."},{"owner":"Gobierno de Datos y TI","text":"· Migrar lo vivo de Entrada Única y Foro y las cuentas de sus usuarios al directorio único."},{"owner":"TI y Gobierno de Producto","text":"· Remediar faltantes: cruzar Entrada Única y Vendor Center contra el destino, decidir por grupo lo que no está en P360, confirmar por escrito y cargar desde la fuente más completa."},{"owner":"Gobierno de Datos y QA","text":"· Convivir: los cambios de P360 llegan cada noche al nuevo PIM, una reconciliación semanal recarga lo que faltó y sólo un sistema es el maestro."},{"owner":"TI con Gobierno de Producto","text":"· Pasar por oleadas las pantallas de Entrada Única y Foro al portal unificado."},{"owner":"TI con Gobierno de Datos","text":"· Cortar por módulo según e     function DependenciesView({module,connection,setConnection,onFeature}){const info=useMemo(()=>{const needs=LINKS.filter(l=>l.sourceModule===module.id);const unlocks=LINKS.filter(l=>l.targetModule===module.id&&l.sourceModule!==module.id);return{needs:groupLinks(needs,'targetModule'),unlocks:groupLinks(unlocks,'sourceModule')}},[module.id]);const critical=useMemo(()=>LINKS.filter(l=>l.sourceModule===module.id||l.targetModule===module.id).filter(l=>openLevel([l])!=='ready').sort((a,b)=>linkWeight(b)-linkWeight(a)).slice(0,8),[module.id]);const related=PRIORITY.filter(f=>f.moduleIds.includes(module.id));return <section className="view"><div className="view-head"><div><h1>Dependencias</h1><p>{module.id} · {module.name}. La flecha conserva la dirección “depende de” registrada en la fuente.</p></div></div><div className="flow" aria-label={`Flujo de dependencias de ${module.name}`}><div className="flow-column flow-left"><h2>Necesita</h2>{info.needs.length?info.needs.map(([id,links])=><Connection key={`n-${id}`} moduleId={id} links={links} pressed={connection?.key===`n-${id}`} onClick={()=>setConnection({key:`n-${id}`,moduleId:id,links})}/>):<div className="empty">Sin dependencias registradas.</div>}</div><div className="selected-module"><span>{module.id}</span><strong>{module.name}</strong><span>{module.counts.stories} historias</span><StateBar counts={module.counts.states} total={module.counts.stories}/></div><div className="flow-column flow-right"><h2>Desbloquea</h2>{info.unlocks.length?info.unlocks.map(([id,links])=><Connection key={`u-${id}`} moduleId={id} links={links} pressed={connection?.key===`u-${id}`} onClick={()=>setConnection({key:`u-${id}`,moduleId:id,links})}/>):<div className="empty">Ningún módulo depende de éste.</div>}</div></div>{connection&&<ConnectionDetail connection={connection} close={()=>setConnection(null)}/>}<div className="critical"><h2>Dependencias críticas</h2>{critical.length?critical.map((l,i)=><div className="critical-row" key={`${l.source}-${l.target}-${i}`}><Status value={openLevel([l])==='decision'?'decision_pendiente':'por_definir'}/><button onClick={()=>setConnection({key:`critical-${i}`,moduleId:l.targetModule,links:[l]})}>{storyMap[l.source]?.title} → {storyMap[l.target]?.title||l.target}</button><span>{l.sourceModule} → {l.targetModule}</span></div>):<div className="empty">No hay relaciones abiertas para este módulo.</div>}</div><section className="related-features"><h2 className="section-title">Features relacionadas con {module.id}</h2>{related.length?related.map(f=><button className="related-feature" key={f.id} onClick={()=>onFeature(f.id)}><strong>{f.name}</strong><span>{f.storyIds.length?`Vinculada · ${f.storyIds.length} historias`:'Sin cobertura'}</span><b>{f.cod==null?'Sin CoD':`CoD ${f.cod}`} →</b></button>):<div className="empty">No hay features vinculadas explícitamente con este módulo.</div>}</section><Legend/></section>}
    function Connection({moduleId,links,pressed,onClick}){const level=openLevel(links),internal=links.every(l=>l.sourceModule===l.targetModule),m=moduleMap[moduleId];return <button className="connection" data-open={level} data-internal={internal} aria-pressed={pressed} onClick={onClick}><i className="shape" aria-hidden="true"/><span><strong>{internal?'Dentro del módulo':`${moduleId} · ${m?.name||'Destino no encontrado'}`}</strong><small>{internal?'Dependencia interna':'Dependencia externa'} · {level==='ready'?'sin aperturas':level==='decision'?'incluye decisión pendiente':'incluye falta de definición'}</small></span><b>{links.length}</b></button>}
    function ConnectionDetail({connection,close}){const ref=useRef(null);useEffect(()=>{ref.current?.focus();const esc=e=>e.key==='Escape'&&close();addEventListener('keydown',esc);return()=>removeEventListener('keydown',esc)},[connection.key]);return <section ref={ref} className="connection-detail" tabIndex="-1" aria-labelledby="connection-title"><div className="detail-head"><h2 id="connection-title">{connection.links.length} relaciones registradas</h2><button className="button" onClick={close}>Cerrar</button></div><div className="pair-list">{connection.links.map((l,i)=><div className="pair" key={`${l.source}-${l.target}-${i}`}><a href={`#view=modulo&module=${l.sourceModule}&story=${l.source}`}>{l.source} · {storyMap[l.source]?.title}</a><span className="pair-arrow">depende de</span><a href={l.targetExists?`#view=modulo&module=${l.targetModule}&story=${l.target}`:l.href}>{l.target} · {storyMap[l.target]?.title||'Destino no encontrado'}{!l.targetExists?' · destino no encontrado':''}</a></div>)}</div></section>}
    function Legend(){return <><p className="implementation-legend"><strong>Estas son dependencias de implementación; no sustituyen la prioridad del Excel.</strong></p><div className="method"><strong>Lectura del flujo:</strong> círculo = relación sin apertura; cuadrado ámbar = falta definición; rombo rojo = decisión pendiente; cuadrado = dependencia interna. El texto acompaña siempre al color.</div></>}
    function ModuleView({module,storyId,setStoryId}){const [query,setQuery]=useState('');const [status,setStatus]=useState('');const [openEpic,setOpenEpic]=useState(()=>storyId?storyMap[storyId]?.epicId:module.epics[0]?.id);const panel=useRef(null);useEffect(()=>{setOpenEpic(storyId?storyMap[storyId]?.epicId:module.epics[0]?.id)},[module.id,storyId]);useEffect(()=>{if(storyId)requestAnimationFrame(()=>panel.current?.focus())},[storyId]);useEffect(()=>{const esc=e=>{if(e.key==='Escape')setStoryId(null)};addEventListener('keydown',esc);return()=>removeEventListener('keydown',esc)},[]);const q=query.trim().toLowerCase();const filtered=module.epics.map(e=>({...e,stories:e.stories.filter(s=>(!status||s.status===status)&&(!q||`${s.id} ${s.title} ${s.como} ${s.quiero} ${s.para} ${s.tasks.map(t=>t.title).join(' ')}`.toLowerCase().includes(q)))})).filter(e=>e.stories.length||(!q&&!status));const story=storyId&&storyMap[storyId]?.moduleId===module.id?storyMap[storyId]:null;return <section className="view"><div className="module-summary"><div><p className="eyebrow">{module.id}</p><h1>{module.name}</h1></div><div className="module-stats"><span><strong>{module.counts.epics}</strong>épicas</span><span><strong>{module.counts.stories}</strong>historias</span><span><strong>{module.process.length}</strong>pasos de proceso</span></div></div>{module.process.length>0&&<details className="process"><summary>Proceso del módulo, de punta a punta</summary><ol>{module.process.map((p,i)=><li key={i}><b>{p.owner}</b> · {p.text}</li>)}</ol></details>}<div className="filters" data-secondary><label className="field">Buscar dentro del módulo<input type="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Historia, tarea o palabra clave"/></label><label className="field">Estado<select value={status} onChange={e=>setStatus(e.target.value)}><option value="">Todos</option><option value="lista">Lista</option><option value="por_definir">Falta definición</option><option value="decision_pendiente">Decisión pendiente</option></select></label></div><div className="epic-layout"><div className="epic-list">{filtered.map(e=><div key={e.id}><button className="epic-button" aria-expanded={openEpic===e.id} onClick={()=>setOpenEpic(openEpic===e.id?null:e.id)}><span><strong>{e.title}</strong>{e.description&&<small>{e.description}</small>}</span><small>{e.stories.length} historias</small></button>{openEpic===e.id&&<div className="story-list">{e.stories.map(s=><button className="story-row" key={s.id} onClick={()=>setStoryId(s.id)}><span className="story-title">{s.id} · {s.title}</span><Status value={s.status}/><span className="dep-count">{s.dependencies.length} dep.</span></button>)}</div>}</div>)}{filtered.length===0&&<div className="empty">No hay historias que coincidan con los filtros.</div>}</div>{story?<StoryPanel story={story} close={()=>setStoryId(null)} panelRef={panel}/>:<aside className="story-panel"><div className="empty">Selecciona una historia para revisar su detalle técnico.</div></aside>}</div></section>}
    function ModuleViewWithFeatures(props){const related=PRIORITY.filter(f=>f.moduleIds.includes(props.module.id));return <><div className="module-features"><strong>Features priorizadas asociadas:</strong>{related.length?related.map(f=><button className="module-feature-link" key={f.id} onClick={()=>props.onFeature(f.id)}>{f.name} · {f.cod==null?'Sin CoD':`CoD ${f.cod}`}</button>):<span>Sin vínculo explícito.</span>}</div><ModuleView {...props}/></>}
    function StoryPanel({story,close,panelRef}){return <aside ref={panelRef} className="story-panel" tabIndex="-1" aria-labelledby="story-title"><button className="close" onClick={close} aria-label="Cerrar detalle">×</button><h2 id="story-title">{story.title}</h2><Status value={story.status}/><div className="cqp"><p><b>Como</b> {story.como}</p><p><b>Quiero</b> {story.quiero}</p><p><b>Para</b> {story.para}</p></div>{story.pending.length>0&&<div className={`pending-box ${story.status==='decision_pendiente'?'decision':''}`}>{story.pending.join(' ')}</div>}<div className="panel-section"><h3>Tareas principales · {story.tasks.length}</h3><ul>{story.tasks.map((t,i)=><li key={i}>{t.title}{t.type&&<span> · {t.type}</span>}</li>)}</ul></div>{story.definitions.length>0&&<div className="panel-section"><h3>Definiciones requeridas</h3><div className="definition-list">{story.definitions.map((d,i)=><div className="definition" key={i}>{d.topic}<span>Lo define: {d.owner||'No indicado en la fuente'}</span></div>)}</div></div>}<div className="panel-section"><h3>Responsable / definidor</h3><p>{story.responsible.length?story.responsible.join(', '):'No indicado en la fuente'}</p></div>{story.dependencies.length>0&&<div className="panel-section"><h3>Depende de</h3><ul>{story.dependencies.map((target,i)=>{const d=storyMap[target];return <li key={i}><a href={`#view=modulo&module=${d?.moduleId||story.moduleId}&story=${target}`}>{target} · {d?.title||'Destino no encontrado'}</a></li>})}</ul></div>}{story.enhancements.length>0&&<div className="panel-section"><h3>Mejoras TO-BE</h3><p>{story.enhancements.join(', ')}</p></div>}{story.evidence&&<div className="panel-section"><h3>Evidencia</h3><p>{story.evidence}</p></div>}</aside>}
    function Closure({module}){const c=module.counts.states;const definitions=module.epics.flatMap(e=>e.stories.flatMap(s=>s.definitions.map(d=>({...d,storyId:s.id,storyTitle:s.title,status:s.status}))));const questionTopics=module.questions.map(q=>({topic:q.question,owner:q.owner,note:q.note,status:'decision_pendiente'}));const topics=[...questionTopics,...definitions].sort((a,b)=>(a.status==='decision_pendiente'?-1:1)-(b.status==='decision_pendiente'?-1:1));const top=topics.slice(0,12);return <section className="view"><div className="view-head"><div><p className="eyebrow">{module.id}</p><h1>Cierre para VoBo · {module.name}</h1><p>Temas concretos que deben responderse antes de considerar aprobado el módulo.</p></div></div><div className="close-summary"><div className="ready"><strong>{c.lista||0}</strong><span>Lista</span></div><div className="define"><strong>{c.por_definir||0}</strong><span>Falta definición</span></div><div className="decision"><strong>{c.decision_pendiente||0}</strong><span>Decisión pendiente</span></div></div><h2 className="section-title">Respuestas necesarias</h2><div className="topics">{top.map((t,i)=><div className="topic" key={i}><p>{t.topic}{t.storyId&&<small> · {t.storyId}</small>}</p><span>Lo define: {t.owner||'No indicado en la fuente'}</span></div>)}</div>{topics.length>12&&<details className="more-topics" data-secondary><summary>Ver los {topics.length-12} temas restantes</summary><div className="topics">{topics.slice(12).map((t,i)=><div className="topic" key={i}><p>{t.topic}{t.storyId&&<small> · {t.storyId}</small>}</p><span>Lo define: {t.owner||'No indicado en la fuente'}</span></div>)}</div></details>}<Method/></section>}
    function Method(){return <footer className="method"><strong>Metodología y evidencia.</strong> Derivado mecánicamente del mapa funcional. Las áreas que definen se normalizan exclusivamente desde <code>story.responsible</code>; los equipos que construyen se leen por separado desde la feature y nunca se usan para atribuir dependencias. Un responsable compuesto se expande a sus grupos normalizados y cada vínculo cuenta una sola vez por par de grupos. “Sin equipo asignado” permanece explícito. CoD ordena prioridad; esfuerzo y WSJF siguen por confirmar. Propuesta para revisión; no aprobada.</footer>}
    const STAR_CASE={feature:'F01',team:'IA/Calidad',blockers:['HU-M1-06-01','HU-M1-05-02']};
    const GLOSSARY={VoBo:'Por confirmar.',CoD:'Cost of Delay; costo de demora usado para ordenar prioridad.',WSJF:'Por confirmar.',TO_BE:'Estado objetivo o futuro.',P360:'Por confirmar.',CCoE:'Por confirmar.',EU:'Por confirmar.',GS1:'Por confirmar.',SKU:'Por confirmar.',EAN:'Por confirmar.',BRD:'Identificador de evidencia; significado por confirmar.',BR:'Identificador de evidencia; significado por confirmar.',FT:'Identificador de evidencia; significado por confirmar.'};
    const GROUP_KIND={'SAP':'tecnico','UX/Frontend':'tecnico','Foro Fotográfico':'tecnico','IA/Calidad':'tecnico','Catálogo/Gobierno de Datos':'tecnico','Plataforma/Portal':'tecnico','Migración/Datos':'tecnico','Marketplace':'negocio','Gobierno de Producto':'negocio','Compras':'negocio','Categorías':'negocio','Comercial/E-commerce':'negocio','Mercaderías':'negocio','Jurídico':'negocio','Logística':'negocio','Entrada Única':'negocio','Operación PIM':'tecnico','Publicación':'tecnico','OMS':'tecnico','Suburbia':'negocio','Dirección':'negocio','Señalización':'negocio','Por validar':'negocio','Sin equipo asignado':'negocio'};
    const RESPONSIBLE_ALIASES=[[/SAP\/CCoE/i,'SAP'],[/Gobierno de Producto/i,'Gobierno de Producto'],[/Gobierno de Datos/i,'Catálogo/Gobierno de Datos'],[/Compras/i,'Compras'],[/Marketplace/i,'Marketplace'],[/Foro Fotográfico|\bForo\b/i,'Foro Fotográfico'],[/\bUX\b/i,'UX/Frontend'],[/equipo de IA|\bIA\b/i,'IA/Calidad'],[/Calidad/i,'IA/Calidad'],[/Category|Categorías/i,'Categorías'],[/Comercial|e-commerce|E-commerce|página de producto/i,'Comercial/E-commerce'],[/Mercaderías/i,'Mercaderías'],[/Jurídico/i,'Jurídico'],[/Logística/i,'Logística'],[/Entrada Única/i,'Entrada Única'],[/Operación/i,'Operación PIM'],[/Publicación|Repoblamiento/i,'Publicación'],[/OMS/i,'OMS'],[/Suburbia/i,'Suburbia'],[/Dirección/i,'Dirección'],[/Señalización/i,'Señalización'],[/DWH|migración/i,'Migración/Datos']];
    const ALL_STORIES=DATA.modules.flatMap(m=>m.epics.flatMap(e=>e.stories));
    const RESPONSIBLE_VALUES=[...new Set(ALL_STORIES.flatMap(s=>s.responsible))].sort();
    const UNMAPPED_RESPONSIBLES=[];
    function normalizeResponsible(value){const groups=[];RESPONSIBLE_ALIASES.forEach(([pattern,group])=>{if(pattern.test(value)&&!groups.includes(group))groups.push(group)});if(/cada área dueña|áreas dueñas|dueños de cada sistema/i.test(value)){groups.push('Por validar');UNMAPPED_RESPONSIBLES.push(value)}if(!groups.length){groups.push('Por validar');UNMAPPED_RESPONSIBLES.push(value)}return groups}
    const RESPONSIBLE_GROUP=Object.fromEntries(RESPONSIBLE_VALUES.map(value=>[value,normalizeResponsible(value)]));
    if(UNMAPPED_RESPONSIBLES.length)console.warn('Responsables por validar:',[...new Set(UNMAPPED_RESPONSIBLES)]);
    const FEATURES_BY_STORY={};DATA.features.forEach(feature=>feature.storyIds.forEach(id=>(FEATURES_BY_STORY[id]||(FEATURES_BY_STORY[id]=[])).push(feature)));
    // Definidores y constructores son dimensiones distintas: sólo los responsables originan relaciones de dependencia.
    function definersOf(story){const fromResponsible=[...new Set((story?.responsible||[]).flatMap(value=>RESPONSIBLE_GROUP[value]||['Por validar']))];return fromResponsible.length?fromResponsible:['Sin equipo asignado']}
    function buildersOfFeature(feature){return [...new Set(proposedTeams(feature).map(team=>team.group))]}
    function groupsForStory(story){return definersOf(story)}
    const STORY_GROUPS=Object.fromEntries(ALL_STORIES.map(story=>[story.id,groupsForStory(story)]));
    const MATRIX_CELLS=new Map;LINKS.forEach(link=>{const sources=STORY_GROUPS[link.source]||['Sin equipo asignado'],targets=STORY_GROUPS[link.target]||['Sin equipo asignado'];sources.forEach(source=>targets.forEach(target=>{const key=source+'→'+target;if(!MATRIX_CELLS.has(key))MATRIX_CELLS.set(key,{key,source,target,links:[]});MATRIX_CELLS.get(key).links.push(link)}))});
    const MATRIX_ROWS=[...MATRIX_CELLS.values()].map(cell=>({...cell,nonReady:cell.links.filter(l=>l.targetStatus!=='lista').length,decision:cell.links.filter(l=>l.targetStatus==='decision_pendiente').length,self:cell.source===cell.target})).sort((a,b)=>Number(a.self)-Number(b.self)||b.decision-a.decision||b.nonReady-a.nonReady||b.links.length-a.links.length);
    const MAPPED_UNIQUE_LINKS=LINKS.filter(link=>!(STORY_GROUPS[link.source]||[]).includes('Sin equipo asignado')&&!(STORY_GROUPS[link.target]||[]).includes('Sin equipo asignado'));
    const OPEN_TARGET_LINKS=LINKS.filter(link=>link.targetStatus!=='lista');
    const INCIDENT_IDS=new Set(LINKS.flatMap(link=>[link.source,link.target]));
    const FEATURE_STORY_IDS=new Set(DATA.features.flatMap(feature=>feature.storyIds));
    const NO_FEATURE_STORIES=ALL_STORIES.filter(story=>!FEATURE_STORY_IDS.has(story.id));
    const NO_FEATURE_NO_RESP=NO_FEATURE_STORIES.filter(story=>story.responsible.length===0);
    function splitTitle(title){const match=title.match(/\s*\((común(?:\s+a)?[^)]*)\)\s*$/i);return match?{main:title.slice(0,match.index).trim(),common:match[1].replace(/^común(?:\s+a)?\s*/i,'').trim()}:{main:title,common:''}}
    function short(text,max=90){return text.length>max?text.slice(0,max-1).trim()+'…':text}
    function topBlockers(links,limit=5){const map=new Map;links.filter(link=>link.targetStatus!=='lista').forEach(link=>{if(!map.has(link.target))map.set(link.target,{story:storyMap[link.target],links:[],teams:new Set});const item=map.get(link.target);item.links.push(link);(STORY_GROUPS[link.source]||[]).forEach(team=>item.teams.add(team))});return [...map.values()].sort((a,b)=>b.links.length-a.links.length).slice(0,limit)}
    const GLOBAL_TOP=topBlockers(LINKS);
    function teamKeywords(group){return {'SAP':/SAP|CCoE/i,'UX/Frontend':/UX|front|visual/i,'Foro Fotográfico':/foro|foto|imagen/i,'IA/Calidad':/\bIA\b|inteligencia artificial|calidad|\bQA\b|score/i,'Catálogo/Gobierno de Datos':/cat[aá]log|gobierno de datos/i,'Plataforma/Portal':/plataforma|portal|API/i,'Migración/Datos':/migra|\bdato/i,'Marketplace':/marketplace|MKP/i}[group]||new RegExp(group,'i')}
    function teamStories(feature,group){const candidates=feature.storyIds.map(id=>storyMap[id]).filter(Boolean);if(feature.id===STAR_CASE.feature&&group===STAR_CASE.team){/* Criterio del caso estrella: historias F01 en M8 con evidencia FT-IA o IA explícita en el título; no se modifica DATA. */return candidates.filter(story=>story.moduleId==='M8'&&(/FT-IA/i.test(story.evidence)||/(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])IA([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]|$)|inteligencia artificial/i.test(story.title)))}const pattern=teamKeywords(group);return candidates.filter(story=>pattern.test([story.title,story.como,story.quiero,story.para,story.enhancements.join(' '),story.tasks.map(t=>t.title).join(' '),story.responsible.join(' ')].join(' ')))}
    function groupedRelations(links,side){const map=new Map;links.forEach(link=>{const story=storyMap[side==='target'?link.target:link.source],groups=STORY_GROUPS[story?.id]||['Sin equipo asignado'];groups.forEach(group=>{if(!map.has(group))map.set(group,[]);map.get(group).push(link)})});const score={decision:2,define:1,ready:0};return [...map].map(([group,items])=>({group,links:items,level:openLevel(items)})).sort((a,b)=>score[b.level]-score[a.level]||b.links.length-a.links.length)}
    function starMetrics(){const feature=featureMap[STAR_CASE.feature],stories=teamStories(feature,STAR_CASE.team),ids=new Set(stories.map(s=>s.id)),outgoing=LINKS.filter(link=>ids.has(link.source));return{feature,stories,outgoing,govProduct:outgoing.filter(link=>definersOf(storyMap[link.target]).includes('Gobierno de Producto')).length,noResponsible:outgoing.filter(link=>definersOf(storyMap[link.target]).includes('Sin equipo asignado')).length,counts:STAR_CASE.blockers.map(id=>({story:storyMap[id],count:outgoing.filter(link=>link.target===id).length}))}}
    const STAR=starMetrics();
    function specificReason(feature,group,stories,outgoing){if(feature.id===STAR_CASE.feature&&group===STAR_CASE.team){const a=STAR.counts[0],b=STAR.counts[1];return STAR.stories.length+' historias de '+group+' en '+feature.name+'; '+a.count+' esperan '+splitTitle(a.story.title).main+' y '+b.count+' esperan '+splitTitle(b.story.title).main+'.'}const top=topBlockers(outgoing,1)[0];if(!stories.length)return (proposedTeams(feature).find(t=>t.group===group)?.reason||'Participación por validar.')+' Sin historias atribuibles por texto.';const owner=top?(STORY_GROUPS[top.story.id]||['Sin equipo asignado']).join(', '):'otro equipo';return stories.length+' historias de '+group+' en '+feature.name+'; '+(top?top.links.length:0)+' esperan definición o decisión de '+owner+'.'}
    function evidenceFor(stories,outgoing){const target=topBlockers(outgoing,1)[0]?.story;const text=target?.pending?.[0]||stories.find(story=>story.pending.length)?.pending[0]||'';return text?short(text,140):'Sin pendiente textual adicional.'}
    function StoryTitle({story}){const parts=splitTitle(story.title);return <span title={story.title} aria-label={story.title}><span className="story-main">{short(parts.main)}</span>{parts.common&&<small className="story-common">Común a: {parts.common}</small>}</span>}
    function Abbr({term,children}){const definition=GLOSSARY[term]||'Por confirmar.';return <abbr className="abbr" tabIndex="0" title={definition} aria-label={term+': '+definition}>{children||term.replace('_','-')}</abbr>}

    function ContractApp2(){const hash=initialHash(),initialFeature=validFeature(hash.feature||localStorage.getItem(FEATURE_STORE));const [view,setView]=useState(validView(hash.view)),[mode,setMode]=useState(hash.mode==='equipo'?'equipo':'feature'),[moduleId,setModuleId]=useState(validModule(hash.module||localStorage.getItem(STORE))),[featureId,setFeatureId]=useState(initialFeature),[teamId,setTeamId]=useState(hash.team||localStorage.getItem(TEAM_STORE)||''),[storyId,setStoryId]=useState(hash.story&&storyMap[hash.story]?hash.story:null),[connection,setConnection]=useState(null),[presenting,setPresenting]=useState(false),[glossary,setGlossary]=useState(false);const panelRef=useRef(null),selected=moduleMap[moduleId],feature=featureMap[featureId];const chooseModule=id=>{const next=validModule(id);setModuleId(next);localStorage.setItem(STORE,next);setConnection(null)};const chooseFeature=id=>{const next=validFeature(id);setFeatureId(next);localStorage.setItem(FEATURE_STORE,next)};const chooseTeam=id=>{setTeamId(id);id?localStorage.setItem(TEAM_STORE,id):localStorage.removeItem(TEAM_STORE)};const toggleTeam=id=>chooseTeam(teamId===id?'':id);const goView=id=>{setView(validView(id));setConnection(null)};const goStory=id=>{const story=storyMap[id];if(!story)return;chooseModule(story.moduleId);setStoryId(id);setView('modulo')};const openModule=id=>{chooseModule(id);setStoryId(null);setView('modulo')};const stepModule=delta=>{const i=DATA.modules.findIndex(m=>m.id===moduleId);chooseModule(DATA.modules[(i+delta+DATA.modules.length)%DATA.modules.length].id)};const togglePresentation=()=>{const next=!presenting;if(next&&(view==='panorama'||view==='prioridad'))setView('equipos');setPresenting(next)};useEffect(()=>{const p=new URLSearchParams({view,module:moduleId,feature:featureId});if(mode)p.set('mode',mode);if(teamId)p.set('team',teamId);if(storyId)p.set('story',storyId);history.replaceState(null,'','#'+p)},[view,mode,moduleId,featureId,teamId,storyId]);useEffect(()=>{const onH
